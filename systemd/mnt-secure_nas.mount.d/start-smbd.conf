[Unit]
# Pull smbd in once the encrypted volume is mounted.
#
# smbd.service only declares Requires=/BindsTo= on this mount, which constrain
# it but do not start it: with the mount reached via fstab's nofail, systemd
# builds the boot transaction without a job for it and drops smbd's job too, so
# smbd never starts and never appears in the journal.
#
# Wants= here supplies the missing trigger. It must NOT be written as
# x-systemd.wants=smbd.service in fstab: that form also generates an implicit
# ordering, which closes a cycle against smbd.service's
# After=mnt-secure_nas.mount and makes systemd drop both jobs. A bare Wants= in
# a drop-in adds no ordering, so smbd simply follows the mount.
Wants=smbd.service
